<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="185" />
    </clipPath>
  </defs>

  <!-- Outer Ring and Background -->
  <circle cx="200" cy="200" r="195" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
  <g clip-path="url(#circleClip)">
    <rect x="0" y="0" width="400" height="400" fill="url(#bgGrad)" />
    
    <!-- Background Decor Circles -->
    <circle cx="90" cy="90" r="45" fill="#93c5fd" opacity="0.4" />
    <circle cx="330" cy="110" r="30" fill="#60a5fa" opacity="0.3" />
    
    <!-- Body / Clothes -->
    <!-- Shoulders & Coat -->
    <path d="M70,400 C80,310 120,270 200,270 C280,270 320,310 330,400 Z" fill="url(#jacketGrad)" />
    <!-- Inner Shirt / Polo -->
    <polygon points="175,270 200,340 225,270" fill="url(#shirtGrad)" />
    <!-- Collar details -->
    <polygon points="160,265 185,295 198,265" fill="#f8fafc" />
    <polygon points="240,265 215,295 202,265" fill="#f8fafc" />

    <!-- Neck -->
    <rect x="180" y="220" width="40" height="55" rx="10" fill="#fcd34d" />
    <!-- Neck shadow -->
    <path d="M180,230 Q200,250 220,230 L220,240 Q200,260 180,240 Z" fill="#f59e0b" opacity="0.6" />

    <!-- Head & Face -->
    <ellipse cx="200" cy="175" rx="58" ry="68" fill="#fde68a" />
    
    <!-- Hair back/base -->
    <path d="M135,160 Q130,95 200,90 Q270,95 265,160 Q265,115 200,105 Q135,115 135,160 Z" fill="#0f172a" />
    <!-- Modern Quiff / Hair styling -->
    <path d="M140,150 C140,95 165,75 210,75 C255,75 270,95 265,140 C250,110 220,100 180,105 C155,108 145,125 140,150 Z" fill="#1e293b" />
    
    <!-- Ears -->
    <circle cx="140" cy="175" r="13" fill="#fcd34d" />
    <circle cx="260" cy="175" r="13" fill="#fcd34d" />
    
    <!-- Eyebrows -->
    <path d="M162,150 Q175,145 188,150" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M212,150 Q225,145 238,150" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Modern Stylish Glasses -->
    <rect x="154" y="156" width="36" height="26" rx="8" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <rect x="210" y="156" width="36" height="26" rx="8" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <!-- Glasses Bridge -->
    <path d="M190,165 Q200,162 210,165" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <!-- Glasses temples -->
    <path d="M154,166 L140,163" stroke="#0f172a" stroke-width="3" />
    <path d="M246,166 L260,163" stroke="#0f172a" stroke-width="3" />

    <!-- Eyes (behind glasses) -->
    <ellipse cx="172" cy="169" rx="4.5" ry="5.5" fill="#0f172a" />
    <circle cx="174" cy="167" r="1.5" fill="#ffffff" />
    <ellipse cx="228" cy="169" rx="4.5" ry="5.5" fill="#0f172a" />
    <circle cx="230" cy="167" r="1.5" fill="#ffffff" />

    <!-- Nose -->
    <path d="M200,175 Q203,190 197,194 Q204,195 206,190" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />

    <!-- Friendly Confident Smile -->
    <path d="M185,208 Q200,222 215,208" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" />
    <!-- Cheeks glow -->
    <circle cx="160" cy="188" r="7" fill="#f87171" opacity="0.25" />
    <circle cx="240" cy="188" r="7" fill="#f87171" opacity="0.25" />

    <!-- Badge / Status Tag Overlay on Bottom -->
    <g transform="translate(130, 345)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#10b981" />
      <circle cx="18" cy="16" r="5" fill="#ffffff" />
      <text x="32" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Aktif Berkarya</text>
    </g>
  </g>
</svg>
